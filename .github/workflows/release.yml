# Baut bei jedem Tag "v*" (z. B. v1.1.0) die exe und veröffentlicht sie als GitHub-Release.
# Manuell gestartet ("Run workflow") wird nur gebaut und die exe als Build-Artefakt abgelegt.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version bestimmen
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-dev"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Veröffentlichen (eigenständige Einzeldatei)
        run: >
          dotnet publish KodiNfoCreator.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: ZIP erstellen
        run: Compress-Archive publish/KodiNfoCreator.exe "KodiNfoCreator-v${{ env.VERSION }}-win-x64.zip"

      - name: Build-Artefakt hochladen
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: KodiNfoCreator-${{ env.VERSION }}
          path: publish/KodiNfoCreator.exe

      - name: GitHub-Release erstellen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/KodiNfoCreator.exe
          "KodiNfoCreator-v${{ env.VERSION }}-win-x64.zip"
          --title "KodiNfoCreator ${{ github.ref_name }}"
          --generate-notes
